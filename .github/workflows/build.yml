# Windows release pipeline: test, build the installer, and upload it as an artifact.
name: Build Windows

on:
  # Main-branch pushes build automatically; workflow_dispatch supports manual runs.
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    # Electron Forge creates the Windows installer on a native Windows runner.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: PFRRecordTool

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.14.0"
          cache: npm
          cache-dependency-path: PFRRecordTool/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Make Windows build
        run: npm run make

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: PFRRecordTool/out/make/squirrel.windows/x64/*.exe
